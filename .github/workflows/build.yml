name: Build & Release

# Every push to main builds the app (the exe files are attached to the run as "Artifacts").
# A GitHub Release with ready-to-run exe files is published automatically when
#   - the <VersionPrefix> in Clicker/Clicker.csproj is a version that has no release yet, or
#   - a tag like v1.2.0 is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to see which versions are already released

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Clicker/Clicker.csproj
          $prefix = "$($project.Project.PropertyGroup.VersionPrefix)".Trim()
          $release = "false"

          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $release = "true"
          } elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -eq "main" -and -not (git tag -l "v$prefix")) {
            $version = $prefix
            $release = "true"
          } else {
            $version = "$prefix-dev.${{ github.run_number }}"
          }

          Write-Host "Version: $version, release: $release"
          "name=$version" >> $env:GITHUB_OUTPUT
          "args=-p:Version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      # Main download: one exe that runs on any Windows 10/11 x64 PC, no .NET installation needed.
      - name: Publish portable exe (self-contained)
        run: >
          dotnet publish Clicker/Clicker.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          ${{ steps.version.outputs.args }}
          -o out/portable

      # Small alternative for PCs that already have the .NET 8 Desktop Runtime.
      - name: Publish small exe (needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish Clicker/Clicker.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          ${{ steps.version.outputs.args }}
          -o out/small

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/portable/Clicker.exe dist/Clicker.exe
          Copy-Item out/small/Clicker.exe dist/Clicker-small-needs-dotnet8.exe
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Clicker-${{ steps.version.outputs.name }}
          path: dist/*

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Clicker ${{ steps.version.outputs.name }}
          files: dist/*
          generate_release_notes: true
